[project]
name = "healforge-backend"
version = "1.0.0"
description = "HealForge FastAPI backend: real scans, safe verification, NVIDIA-only inference"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "SIM", "RUF", "BLE", "PIE", "PL"]
ignore = [
    "B008",   # FastAPI DI pattern: `= File(...)`, `= Depends(...)` defaults are idiomatic here
    "S101",   # asserts are used pervasively in the pytest suite
    "S104",   # binding checks: 127.0.0.1 in dev
    "S108",   # no temp-file usage of concern
    "S603",   # subprocess usage is confined to the migration test with explicit args
    "PLR0913",# router signatures legitimately take many deps
    "PLC0415",# deliberate function-level imports break circular-import cycles (serializers <-> routers)
    "PLR2004",# small numeric literals in request validation are self-documenting
    "PLR0911",# long orchestrators (scan pipeline) are intentionally linear
    "PLR0912",# branch count follows the scan-type dispatch table
    "PLR0915",# statement count follows the pipeline stages
    "PLR0917",# router functions take typed deps positionally by FastAPI convention
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "PLR2004", "S608"]  # fixtures carry fake SQLi strings + fake secrets
"alembic/versions/*" = ["W291", "W293", "E501", "PLR0915"]  # autogenerated migrations

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
